<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide@latest">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-main: #1E1E1E;
            --bg-panel: #252526;
            --bg-pseudocode: #1B1B1B;
            --border-color: #3C3C3C;
            --text-primary: #D4D4D4;
            --text-secondary: #858585;
            --accent-color: #569CD6;
            --hover-highlight: #2A2D2E;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .workspace {
            display: flex;
            height: 100vh;
        }

        /* ===== ACTIVITY BAR ===== */
        .activity-bar {
            width: 50px;
            background-color: var(--bg-main);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 16px;
        }

        .activity-item {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
            border: 1px solid transparent;
        }

        .activity-item:hover {
            background-color: var(--hover-highlight);
            color: var(--text-primary);
        }

        .activity-item.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .activity-item svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* ===== NAVIGATION PANEL ===== */
        .nav-panel {
            width: 280px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .nav-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-header h3 {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .nav-header button {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .nav-header button:hover {
            color: var(--text-primary);
            background-color: var(--hover-highlight);
            border-radius: 3px;
        }

        .nav-header button svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .nav-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .course-item {
            margin-bottom: 2px;
        }

        .course-header {
            display: flex;
            align-items: center;
            padding: 8px 8px;
            cursor: pointer;
            border-radius: 4px;
            user-select: none;
            transition: all 0.2s ease;
        }

        .course-header:hover {
            background-color: var(--hover-highlight);
        }

        .course-header.active {
            background-color: var(--accent-color);
            color: #fff;
        }

        .course-toggle {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            color: currentColor;
            flex-shrink: 0;
        }

        .course-toggle svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            transition: transform 0.2s ease;
        }

        .course-item.collapsed .course-toggle svg {
            transform: rotate(-90deg);
        }

        .course-name {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
        }

        .task-list {
            display: none;
            padding-left: 20px;
            margin-top: 4px;
        }

        .course-item.expanded .task-list {
            display: block;
        }

        .task-item {
            padding: 6px 8px;
            margin-bottom: 2px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            border-left: 2px solid transparent;
        }

        .task-item:hover {
            color: var(--text-primary);
            background-color: var(--hover-highlight);
        }

        .task-item.active {
            color: var(--accent-color);
            border-left-color: var(--accent-color);
            background-color: rgba(86, 156, 214, 0.1);
        }

        /* ===== CONTENT WORKSPACE ===== */
        .content-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
        }

        .content-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .block {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            transition: all 0.2s ease;
        }

        .block:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(86, 156, 214, 0.1);
        }

        .block-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-bottom: 12px;
        }

        .block-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .block-text {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .pseudocode-block {
            background-color: var(--bg-pseudocode);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-primary);
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .pseudocode-block .keyword {
            color: #569CD6;
            font-weight: 500;
        }

        .pseudocode-block .function {
            color: #DCDCAA;
        }

        .pseudocode-block .comment {
            color: #6A9955;
        }

        .analysis-block {
            background-color: rgba(86, 156, 214, 0.05);
            border-left: 3px solid var(--accent-color);
        }

        /* ===== INSPECTOR PANEL ===== */
        .inspector-panel {
            width: 300px;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .inspector-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .inspector-header h3 {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .inspector-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .inspector-field {
            display: flex;
            flex-direction: column;
        }

        .inspector-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .inspector-value {
            font-size: 13px;
            color: var(--text-primary);
            padding: 8px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
            border: 1px solid var(--border-color);
        }

        .inspector-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: #6DAAE6;
            box-shadow: 0 2px 8px rgba(86, 156, 214, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: var(--bg-main);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        .btn-secondary:hover {
            background-color: rgba(86, 156, 214, 0.1);
        }

        .btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* ===== FORM STYLES ===== */
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            padding: 8px 10px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(86, 156, 214, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .file-upload-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-upload-wrapper:hover {
            border-color: var(--accent-color);
            background-color: rgba(86, 156, 214, 0.05);
        }

        .file-upload-wrapper input[type="file"] {
            display: none;
        }

        .file-upload-text {
            font-size: 12px;
            color: var(--text-secondary);
            flex: 1;
        }

        .file-upload-selected {
            color: var(--accent-color);
        }

        /* ===== TRAINING CONFIG SECTION ===== */
        .training-config {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .training-config .block-label {
            margin-bottom: 16px;
        }

        /* ===== NETWORK VISUALIZATION ===== */
        .network-viz {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .network-canvas {
            width: 100%;
            height: 350px;
            background: linear-gradient(135deg, #0F1117 0%, #1A1D24 100%);
            border: 1px solid #2A2F3A;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            margin-top: 12px;
            position: relative;
            overflow: hidden;
        }

        .network-canvas svg {
            filter: drop-shadow(0 0 20px rgba(93, 169, 255, 0.1));
        }

        /* Node Styling */
        .nn-node {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            filter: drop-shadow(0 0 8px rgba(77, 163, 255, 0.3));
        }

        .nn-node:hover {
            filter: drop-shadow(0 0 16px rgba(255, 209, 102, 0.6));
            r: 18;
        }

        .nn-node.input-layer {
            fill: #5DD6FF;
        }

        .nn-node.hidden-layer {
            fill: #4DA3FF;
        }

        .nn-node.output-layer {
            fill: #FFB86B;
        }

        /* Edge Styling */
        .nn-edge {
            stroke: #7CC4FF;
            stroke-width: 2px;
            opacity: 0.75;
            transition: all 0.3s ease;
        }

        .nn-edge-glow {
            stroke: #7CC4FF;
            stroke-width: 4px;
            opacity: 0.2;
            filter: blur(1px);
        }

        .nn-node:hover ~ .nn-edge,
        .nn-edge:hover {
            stroke: #FFD166;
            stroke-width: 2.5px;
            opacity: 0.95;
        }

        /* Layer Labels */
        .nn-layer-label {
            fill: #E6EDF3;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        /* Glow Filter */
        @keyframes nodeGlow {
            0%, 100% {
                filter: drop-shadow(0 0 8px rgba(77, 163, 255, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 16px rgba(77, 163, 255, 0.6));
            }
        }

        /* Animation for training */
        @keyframes pulseGlow {
            0% {
                opacity: 0.4;
                r: 16;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.4;
                r: 18;
            }
        }

        .nn-node.active {
            animation: pulseGlow 1.5s ease-in-out infinite;
        }

        /* Smooth transitions for charts */
        @keyframes drawPath {
            from {
                stroke-dashoffset: 1000;
            }
            to {
                stroke-dashoffset: 0;
            }
        }

        .loss-curve-animate {
            stroke-dasharray: 1000;
            animation: drawPath 2s ease-out forwards;
        }

        /* ===== RESULTS SECTION ===== */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            margin-top: 16px;
        }

        .result-card {
            background-color: var(--bg-pseudocode);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
        }

        .result-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .result-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-color);
        }

        /* ===== TABLE STYLES ===== */
        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 12px;
        }

        .results-table th {
            background-color: rgba(86, 156, 214, 0.1);
            padding: 8px;
            text-align: left;
            font-weight: 600;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
        }

        .results-table td {
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .results-table tr:hover {
            background-color: rgba(86, 156, 214, 0.05);
        }

        /* ===== PREDICTION SECTION ===== */
        .prediction-section {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
        }

        .prediction-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        .prediction-results {
            background-color: var(--bg-pseudocode);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            margin-top: 12px;
        }

        .prediction-result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .prediction-result-item:last-child {
            margin-bottom: 0;
        }

        .prediction-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .prediction-bar {
            height: 20px;
            background-color: rgba(86, 156, 214, 0.2);
            border-radius: 3px;
            margin: 0 8px;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .prediction-bar-fill {
            height: 100%;
            background-color: var(--accent-color);
            border-radius: 3px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #000;
        }

        .warning-box {
            background-color: rgba(241, 196, 15, 0.1);
            border-left: 3px solid #f1c40f;
            border-radius: 4px;
            padding: 12px;
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-primary);
        }

        .warning-box ul {
            margin: 8px 0 0 16px;
            color: var(--text-secondary);
        }

        .warning-box li {
            margin-bottom: 4px;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background-color: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: var(--text-secondary);
        }

        /* ===== UTILITIES ===== */
        .hidden {
            display: none !important;
        }

        svg {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="workspace">
        <!-- ACTIVITY BAR -->
        <div class="activity-bar">
            <div class="activity-item active" data-mode="courses" title="Courses">
                <svg viewBox="0 0 24 24">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
            </div>
            <div class="activity-item" data-mode="search" title="Search">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>

            </div>
            <div class="activity-item" data-mode="favorites" title="Favorites">

                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
                </svg>
            </div>
            <div class="activity-item" data-mode="settings" title="Settings">

            </div>

        <!-- NAVIGATION PANEL -->
        <div class="nav-panel">
            <div class="nav-header">
                <h3>Courses</h3>
                <button id="addCourseBtn" title="Add Course">

                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
            <div class="nav-content" id="navContent">
                <!-- Courses will be populated here -->
            </div>
        </div>

        <!-- CONTENT WORKSPACE -->
        <div class="content-workspace">
            <div class="content-header">
                <h2 id="contentTitle">Select a task to view details</h2>
            </div>
            <div class="content-body" id="contentBody">
                <div style="text-align: center; color: var(--text-secondary); padding: 40px 20px;">
                    <svg style="width: 48px; height: 48px; margin: 0 auto 16px; opacity: 0.5;" viewBox="0 0 24 24">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    <p>Pilih task dari sidebar untuk memulai</p>
                </div>
            </div>
        </div>

        <!-- INSPECTOR PANEL -->
        <div class="inspector-panel">
            <div class="inspector-header">
                <h3>Task Info</h3>
            </div>
            <div class="inspector-content" id="inspectorContent">
                <div style="text-align: center; color: var(--text-secondary); font-size: 12px;">
                    <p>Belum ada task terpilih</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample data
        const data = {
            courses: [
                {
                    id: 'neural-classifier',
                    name: 'Neural Classifier',
                    tasks: [
                        {
                            id: 'dnn-classifier',
                            name: 'Tugas 1 - Deep Neural Network Classifier',
                            course: 'Neural Classifier',
                            meeting: 'Meeting 1',
                            date: '2026-03-09',
                            tags: ['Neural Network', 'Classification', 'Deep Learning'],
                            isInteractive: true,
                            blocks: []

                    ]
                },
                {
                    id: 'img-processing',
                    name: 'Image Processing',
                    tasks: [
                        {
                            id: 'rgb-extraction',

                            course: 'Image Processing',
                            meeting: 'Meeting 3',
                            date: '2024-03-15',
                            tags: ['Image Processing', 'Pixels', 'Algorithm'],
                            blocks: [

                                <span class="prediction-label">0</span>
                                <div class="prediction-bar">
                                    <div class="prediction-bar-fill" style="width: 90.7%">90.7%</div>
                                </div>
                                <span class="prediction-label" style="width: 40px; text-align: right;">90.7%</span>
                            </div>
                            <div class="prediction-result-item">
                                <span class="prediction-label">1</span>
                                <div class="prediction-bar">
                                    <div class="prediction-bar-fill" style="width: 9.3%">9.3%</div>
                                </div>
                                <span class="prediction-label" style="width: 40px; text-align: right;">9.3%</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(testBlock);
        }

        function updateFileLabel(input, labelId) {
            const label = document.getElementById(labelId);
            if (input.files && input.files[0]) {
                label.classList.add('file-upload-selected');
                label.textContent = input.files[0].name;
            }
        }

        function trainModel() {
            // Delegated to app.js
            window.trainModel();
        }

        function updatePrediction() {
            // Delegated to app.js
            window.updatePrediction();
        }

        function renderInspector(task) {
            const inspectorContent = document.getElementById('inspectorContent');
            
            if (task.isInteractive) {
                inspectorContent.innerHTML = `
                    <div class="inspector-field">
                        <div class="inspector-label">Jenis Tugas</div>
                        <div class="inspector-value">Aplikasi Interaktif</div>
                    </div>
                    <div class="inspector-field">
                        <div class="inspector-label">Skill yang Dibutuhkan</div>
                        <div style="display: flex; flex-wrap: wrap;">
                            <span style="display: inline-block; background-color: var(--hover-highlight); padding: 3px 8px; border-radius: 3px; margin: 2px; font-size: 11px;">Neural Network</span>
                            <span style="display: inline-block; background-color: var(--hover-highlight); padding: 3px 8px; border-radius: 3px; margin: 2px; font-size: 11px;">Classification</span>
                            <span style="display: inline-block; background-color: var(--hover-highlight); padding: 3px 8px; border-radius: 3px; margin: 2px; font-size: 11px;">Deep Learning</span>
                        </div>
                    </div>
                    <div class="inspector-field">
                        <div class="inspector-label">Output Diharapkan</div>
                        <div class="inspector-value">Model Terlatih + Evaluasi</div>
                    </div>
                    <div class="inspector-buttons">
                        <button class="btn" onclick="alert('Download model dan documentation')">
                            <svg viewBox="0 0 24 24">
                                <polyline points="8 17 12 21 16 17"></polyline>
                                <line x1="12" y1="12" x2="12" y2="21"></line>
                                <path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"></path>
                            </svg>
                            Export Results
                        </button>
                        <button class="btn btn-secondary" onclick="alert('Instruksi: 1. Upload CSV files\\n2. Set network parameters\\n3. Click Train & Evaluate\\n4. View results and test predictions')">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="16" x2="12" y2="12"></line>
                                <line x1="12" y1="8" x2="12.01" y2="8"></line>
                            </svg>
                            Help
                        </button>
                    </div>
                `;
            } else {
                const tagsHtml = task.tags.map(tag => `<span style="display: inline-block; background-color: var(--hover-highlight); padding: 3px 8px; border-radius: 3px; margin: 2px; font-size: 11px;">${tag}</span>`).join('');

                inspectorContent.innerHTML = `
                    <div class="inspector-field">
                        <div class="inspector-label">Course</div>
                        <div class="inspector-value">${task.course}</div>
                    </div>
                    <div class="inspector-field">
                        <div class="inspector-label">Meeting</div>
                        <div class="inspector-value">${task.meeting}</div>
                    </div>
                    <div class="inspector-field">
                        <div class="inspector-label">Date</div>
                        <div class="inspector-value">${task.date}</div>
                    </div>
                    <div class="inspector-field">
                        <div class="inspector-label">Tags</div>
                        <div style="display: flex; flex-wrap: wrap;">${tagsHtml}</div>
                    </div>
                    <div class="inspector-buttons">
                        <button class="btn">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="1"></circle>
                                <circle cx="19" cy="12" r="1"></circle>
                                <circle cx="5" cy="12" r="1"></circle>
                            </svg>
                            Edit Task
                        </button>
                        <button class="btn btn-secondary">
                            <svg viewBox="0 0 24 24">
                                <polyline points="8 17 12 21 16 17"></polyline>
                                <line x1="12" y1="12" x2="12" y2="21"></line>
                                <path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"></path>
                            </svg>
                            Upload File
                        </button>
                        <button class="btn btn-secondary">
                            <svg viewBox="0 0 24 24">
                                <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                                <polyline points="13 2 13 9 20 9"></polyline>
                            </svg>
                            Export PDF
                        </button>
                    </div>
                `;

                // Add event listeners to buttons
                inspectorContent.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const action = this.textContent.trim();
                        alert(`Action: ${action} for task "${task.name}"`);
                    });
                });
            }
        }

        function setupEventListeners() {
            // Activity bar mode switching
            document.querySelectorAll('.activity-item').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.activity-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // Add course button
            document.getElementById('addCourseBtn').addEventListener('click', () => {
                const courseName = prompt('Enter course name:');
                if (courseName) {
                    alert(`Course "${courseName}" added (demo only)`);
                }
            });
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initializeUI);
    </script>
    
    <!-- Application Logic - Neural Network Classifier -->
    <script src="app.js"></script>
</body>
</html>
